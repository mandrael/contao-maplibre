name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: PHP-Lint (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      # php -l prüft nur die Syntax (Parse) je PHP-Version, keine API-Kompatibilität.
      - name: PHP-Syntax-Check (php -l)
        run: |
          find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
          php -l contao/templates/ce_maplibre_map.html5

  tests:
    name: Tests & statische Analyse (Contao ${{ matrix.contao }}, PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Je LTS-Linie gezielt installiert, damit eine API, die nur einer Linie fehlt, hier auffällt.
        # PHP 8.1 prüft der Lint-Job; hier 8.2, so lokal nachgestellt (PHPUnit 10.5 für 4.13/5.3).
        include:
          - contao: '4.13'
            php: '8.2'
          - contao: '5.3'
            php: '8.2'
          - contao: '5.7'
            php: '8.4'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: composer validate
        run: composer validate --no-check-publish --strict
      # Composer blockiert Pakete mit Sicherheitshinweisen; jede 4.13.x hat welche (Linie ohne Support).
      - name: Sicherheitssperre für 4.13 lösen
        if: matrix.contao == '4.13'
        run: composer config audit.block-insecure false
      # contao/test-case wird von den Tests nicht genutzt und würde die Linie 4.13 ausschließen.
      - name: Contao-Linie festlegen
        run: |
          composer remove --dev contao/test-case --no-update --no-interaction
          composer require "contao/core-bundle:${{ matrix.contao }}.*" --no-update --no-interaction
      - name: Abhängigkeiten installieren
        run: composer update --no-plugins --no-interaction --no-progress --prefer-dist
      - name: Installierte Contao-Version
        run: composer show contao/core-bundle | grep -E '^versions'
      - name: PHPUnit
        run: vendor/bin/phpunit
      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G
